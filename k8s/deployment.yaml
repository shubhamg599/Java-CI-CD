apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
        - name: java-app
          image: 658860694489.dkr.ecr.us-east-1.amazonaws.com/jenkins-ci-cd:IMAGE_TAG
          ports:
            - containerPort: 8080
